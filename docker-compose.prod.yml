# Producción self-hosted (Next standalone, sin hot reload).
#   cp .env.docker.example .env
#   docker compose -f docker-compose.prod.yml up --build -d

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      DATABASE_URL: ${DATABASE_URL:-file:/data/dev.db}
      SESSION_SECRET: ${SESSION_SECRET:?Definí SESSION_SECRET en .env}
      RUN_SEED: ${RUN_SEED:-false}
      NODE_ENV: production
    volumes:
      - paton_sqlite:/data
      - paton_uploads:/app/public/uploads
    restart: unless-stopped

volumes:
  paton_sqlite:
  paton_uploads:
